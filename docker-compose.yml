services:

  # ---------- PHP / Laravel ----------
  app:
    build:
      context: .                          # root project sebagai build context
      dockerfile: docker/php/Dockerfile   # lokasi Dockerfile
    container_name: booking_app
    volumes:
      # Bind mount: folder project di Mac <-> /var/www/html di container.
      # Edit kode di editor langsung terlihat di container.
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy        # tunggu MySQL benar-benar siap

  # ---------- Web server ----------
  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    ports:
      - "8088:80"                         # host:container -> buka http://localhost:8088
    volumes:
      - .:/var/www/html                   # nginx butuh akses ke folder public/ (file statis)
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro   # ro = read-only
    depends_on:
      - app

  # ---------- Database ----------
  db:
    image: mysql:8.0
    container_name: booking_db
    environment:
      MYSQL_DATABASE: online_booking_praktek
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3308:3306"                       # 3308 di host agar tidak bentrok dengan MySQL lain
    volumes:
      - dbdata:/var/lib/mysql             # named volume: data tetap ada walau container dihapus
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Vite (frontend dev server) ----------
  node:
    image: node:22-alpine
    container_name: booking_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"                       # port default Vite
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  dbdata:
