server {
    # Nginx di dalam container mendengarkan port 80
    # (di-map ke port 8080 host lewat docker-compose.yml).
    listen 80;
    index index.php;

    # Document root Laravel adalah folder public/, BUKAN root project.
    # Path ini ada di container nginx karena kode di-mount ke lokasi yang sama.
    root /var/www/html/public;

    # Jika file/folder tidak ditemukan, serahkan ke index.php (front controller Laravel).
    # Inilah yang membuat route seperti /dashboard bisa jalan.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Semua file .php diteruskan ke PHP-FPM.
    location ~ \.php$ {
        # "app" = nama service PHP di docker-compose.yml.
        # Docker network me-resolve nama ini ke IP container app.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Blokir akses ke file tersembunyi (.env, .git, dll), kecuali .well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
